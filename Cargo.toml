[package]
name = "cocapn-wasm"
version = "0.1.0"
edition = "2021"
description = "CoCapn for the browser — deadbands, PID, and marine logic compiled to WebAssembly"
license = "MIT"
repository = "https://github.com/SuperInstance/cocapn-wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[profile.release]
opt-level = "z"
lto = true
